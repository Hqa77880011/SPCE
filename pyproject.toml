[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spce"
version = "0.1.0"
description = "Speed-posterior propagated cyclic evidence for bearing diagnosis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.2", "matplotlib>=3.7", "joblib>=1.3"]

[project.scripts]
spce = "spce.cli:main"

[tool.setuptools.packages.find]
include = ["spce*"]
